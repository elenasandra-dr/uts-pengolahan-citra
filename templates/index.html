<!DOCTYPE html>
<html>
    <head>
        <title>UTS Pengolahan Citra</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                max-width: 1000px;
                margin: 0 auto;
                padding: 20px;
            }
            .image-container {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
                margin-top: 30px;
            }
            .image-box {
                border: 1px solid #eee;
                padding: 15px;
                border-radius: 8px;
                background: #f9f9f9;
            }
            img {
                max-width: 100%;
                border: 1px solid #ddd;
            }
            button {
                background: #4285f4;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 4px;
                font-size: 16px;
                cursor: pointer;
                margin-top: 10px;
            }
            button:hover {
                background: #3367d6;
            }
            .upload-section {
                text-align: center;
                padding: 20px;
                border: 2px dashed #ddd;
                border-radius: 8px;
            }
            h2 {
                color: #444;
                margin-top: 0;
            }
        </style>
    </head>
    <body>
        <h1>Konversi Citra</h1>

        <div class="upload-section">
            <form method="post" enctype="multipart/form-data">
                <input type="file" name="image" accept="image/*" required />
                <button type="submit">Process Image</button>
            </form>
        </div>

        {% if original_img %}
        <div class="image-container">
            <div class="image-box">
                <h2>Original Image</h2>
                <img src="{{ original_img }}" />
            </div>

            <div class="image-box">
                <h2>Grayscale</h2>
                <img src="{{ grayscale_img }}" />
            </div>

            <div class="image-box">
                <h2>Binary (Black & White)</h2>
                <img src="{{ binary_img }}" />
            </div>

            <div class="image-box">
                <h2>Indexed Color (8-bit)</h2>
                <img src="{{ indexed_img }}" />
            </div>
        </div>
        {% endif %}
    </body>
</html>
